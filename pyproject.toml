[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isitmyisp"
version = "0.1.0.dev0"
description = "Is it your Wi-Fi, your router or your ISP? Self-hosted connection monitor that finds where the problem is and builds the evidence report your ISP needs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enzo Meneghini" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0", "flask-login>=0.6.3", "flask-wtf>=1.2", "argon2-cffi>=23.1", "flask-limiter>=3.5", "waitress>=3.0"]
pdf = ["weasyprint>=60"]

[project.scripts]
isitmyisp = "isitmyisp.cli:main"

[tool.setuptools.packages.find]
include = ["isitmyisp*"]

[tool.setuptools.package-data]
"isitmyisp.webapp" = ["templates/*.html", "static/*", "static/fonts/*"]
