# Public demo (isitmyisp.enzo-meneghini.com): the web UI rendered to static files from SYNTHETIC data,
# the documentation at /docs (docs/site/*.md) and the installer at /install.sh.
# Every deploy regenerates it, so the dates are always recent. Nothing here measures any network.
[build]
  command = "pip install --no-cache-dir '.[web]' markdown && python -m isitmyisp.cli demo --static site && python scripts/build_docs.py site && cp install.sh site/install.sh"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"
  TZ = "America/Argentina/Jujuy"

[[redirects]]
  from = "/"
  to = "/es/isp/"
  status = 302

# the installer, readable in a browser before piping it into a shell
[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"
