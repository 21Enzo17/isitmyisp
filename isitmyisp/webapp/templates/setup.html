<!doctype html>
<html lang="{{ lang }}"{% if theme %} data-theme="{{ theme }}"{% endif %}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.setup_title }} · isitmyisp</title><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml"><link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}"><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}"><meta name="theme-color" content="#0a1121"><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=css_v) }}"></head>
<body><div class="auth-wrap"><div class="auth">
  <a class="brand" href="/"><img class="mark" src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="32" height="32"><span>isitmyisp</span></a>
  <div class="card"><h3>{{ t.setup_title }}</h3><p class="muted">{{ t.setup_sub }}</p>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="tok">{{ t.token }}</label><input type="text" id="tok" name="token" value="{{ token }}" required autocomplete="off">
      <label for="u">{{ t.username }}</label><input type="text" id="u" name="username" autocomplete="username" required maxlength="64">
      <label for="p">{{ t.password }}</label><input type="password" id="p" name="password" autocomplete="new-password" minlength="10" required>
      <label for="c">{{ t.confirm }}</label><input type="password" id="c" name="confirm" autocomplete="new-password" minlength="10" required>
      <div class="actions"><button class="btn primary" type="submit">{{ t.create }}</button></div>
    </form></div>
</div></div></body></html>
